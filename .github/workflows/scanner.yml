name: Bet Value Scanner

# Scanner automático desactivado deliberadamente.
# El control de eventos ahora ocurre desde Telegram cuando el usuario lo solicita.
# Los modos históricos siguen disponibles manualmente desde GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecución manual"
        required: true
        default: "digest"
        type: choice
        options:
          - digest
          - live
          - analyze
          - test_telegram
          - full
      sport:
        description: "Solo para analyze"
        required: false
        default: "football"
        type: choice
        options:
          - tennis
          - football
          - nba
      event_id:
        description: "Solo para analyze"
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and run selected manual mode
        env:
          PYTHONPATH: .
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m compileall -q app scripts tests
          python -m scripts.preflight
          if [ "${{ inputs.mode }}" = "digest" ]; then
            python -m scripts.daily_digest
          elif [ "${{ inputs.mode }}" = "live" ]; then
            python -m scripts.live_scan
          elif [ "${{ inputs.mode }}" = "analyze" ]; then
            test -n "${{ inputs.event_id }}"
            python -m scripts.analyze_event --sport "${{ inputs.sport }}" --event-id "${{ inputs.event_id }}"
          elif [ "${{ inputs.mode }}" = "test_telegram" ]; then
            python -m scripts.test_telegram
          else
            python -m scripts.scan --full
          fi
