name: Bet Value Telegram Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# One listener at a time. Each run is shorter than the 5-minute schedule,
# so a new run does not kill the listener that is currently receiving updates.
concurrency:
  group: telegram-control
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Telegram control
        env:
          PYTHONPATH: .
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PREANALYSIS_MODEL: gpt-5.6-luna
          # Leave enough margin for checkout/install/offset persistence before
          # the next scheduled run. GitHub's shortest schedule interval is 5 min.
          TELEGRAM_POLL_SECONDS: "150"
        run: python -m scripts.telegram_bot

      - name: Persist Telegram offset
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/telegram_offset_v2.json)" ]; then
            echo "Sin cambios de offset"
            exit 0
          fi
          git config user.name "bet-value-engine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_offset_v2.json
          git commit -m "chore: persist Telegram bot offset [skip ci]"
          git pull --rebase origin main
          git push origin main
